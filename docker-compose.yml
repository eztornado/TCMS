# TornadoCMS — docker-compose para Coolify (y para desarrollo local).
#
# En Coolify: crea un recurso "Docker Compose" apuntando a este repo y define
# estas variables en la UI (Settings → Environment):
#   APP_KEY (php artisan key:generate --show), APP_URL, FRONT_URL,
#   DB_PASSWORD, DB_ROOT_PASSWORD, SANCTUM_STATEFUL_DOMAINS,
#   STRIPE_SECRET / STRIPE_WEBHOOK_SECRET (opcional),
#   ADMIN_EMAIL / ADMIN_PASSWORD (solo el primer despliegue).
#
# El único puerto publicado es el del front (nginx del panel, que hace de
# proxy a /api). Para exponer el API directamente, publica API_PORT.

name: tcms

x-api-common: &api-common
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  environment: &api-environment
    APP_NAME: ${APP_NAME:-TornadoCMS}
    APP_ENV: ${APP_ENV:-production}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-http://localhost:8080}
    FRONT_URL: ${FRONT_URL:-http://localhost:8080}
    # Sanctum SPA: dominio del front (con puerto) que comparte cookies.
    SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}
    SESSION_DOMAIN: ${SESSION_DOMAIN:-}
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-tcms}
    DB_USERNAME: ${DB_USERNAME:-tcms}
    DB_PASSWORD: ${DB_PASSWORD:-}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    FILESYSTEM_DISK: public
    MAIL_MAILER: ${MAIL_MAILER:-log}
    STRIPE_SECRET: ${STRIPE_SECRET:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    TCMS_PAYMENT_GATEWAY: ${TCMS_PAYMENT_GATEWAY:-auto}

services:
  api:
    <<: *api-common
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    environment:
      <<: *api-environment
      CONTAINER_ROLE: app
    volumes:
      - api-storage:/var/www/html/storage/app/public
    healthcheck:
      # 127.0.0.1, no localhost: busybox wget prueba ::1 primero y nginx solo escucha IPv4.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/up']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Cola de trabajos (emails, exports, webhooks pesados...).
  queue:
    <<: *api-common
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    environment:
      <<: *api-environment
      CONTAINER_ROLE: queue
    command: ['php', 'artisan', 'queue:work', 'redis', '--tries=3', '--backoff=10', '--max-time=3600']

  # Scheduler (reservas de stock caducadas, purga de auditoría...).
  scheduler:
    <<: *api-common
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
    environment:
      <<: *api-environment
      CONTAINER_ROLE: scheduler
    command: ['php', 'artisan', 'schedule:work']

  # Panel admin (SPA estática servida por nginx con proxy /api → api).
  front:
    build:
      context: .
      dockerfile: ./docker/front/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${FRONT_PORT:-8080}:80'

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tcms}
      MYSQL_USER: ${DB_USERNAME:-tcms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Coolify: no publiques 3306 salvo necesidad de acceso externo.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
  api-storage:
