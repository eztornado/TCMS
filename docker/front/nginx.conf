# SPA del panel: estáticos + proxy al API (mismo origen → cookies de
# Sanctum sin configuración de CORS adicional).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash: cache agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API y ficheros de media van al backend (mismo origen).
    location /api/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /storage/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CSRF cookie de Sanctum se pide por /sanctum/csrf-cookie.
    location /sanctum/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
