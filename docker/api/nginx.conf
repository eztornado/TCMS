# nginx delante de php-fpm: docroot public/ con front controller.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 32m;

    # Compresión de respuestas API.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Ficheros de media servidos directamente por nginx (storage público).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 30d;
    }
}
